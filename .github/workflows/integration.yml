name: Integration & E2E

on:
  push:
    branches: [main]
  pull_request:

jobs:
  integration-and-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Verify Docker
        run: docker version

      - name: Run integration and e2e tests with coverage
        run: |
          go test -v \
            -tags=integration,e2e \
            -covermode=atomic \
            -coverprofile=coverage-integration.txt \
            ./...

      - name: Upload integration coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage-integration.txt
          flags: integration
          name: integration-e2e
          fail_ci_if_error: true
          verbose: true
