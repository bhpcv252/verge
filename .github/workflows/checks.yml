name: Checks

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build tools image
        run: docker compose build tools

      - name: Generate protobuf code
        run: make proto

      - name: Verify generated code is committed
        run: git diff --exit-code

      - name: Run lint
        run: docker compose run --rm -e GOFLAGS=-buildvcs=false tools golangci-lint run

      - name: Run tests
        run: go test ./...

      - name: Verify server build
        run: go build ./cmd/server

      - name: Verify worker build
        run: go build ./cmd/worker
