services:
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENERS: "PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: "/tmp/kraft-combined-logs"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-broker-api-versions --bootstrap-server kafka:29092 || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - eventbus

  worker:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      # uncomment if VERGE_OUTBOX_EVENTBUS_ENABLED=true:
      # kafka:
      #   condition: service_healthy
    env_file:
      - .env
    environment:
      # override .env with docker-compose network values
      VERGE_STORAGE_POSTGRES_URL: postgres://verge:changeme@postgres:5432/verge?sslmode=disable
      VERGE_STORAGE_REDIS_URL: redis://redis:6379
      VERGE_STORAGE_NEO4J_URL: bolt://neo4j:changeme@neo4j:7687

      VERGE_OUTBOX_SOURCE_TYPE: polling
      VERGE_OUTBOX_POLL_INTERVAL: ${VERGE_OUTBOX_POLL_INTERVAL:-500ms}
      VERGE_OUTBOX_BATCH_SIZE: ${VERGE_OUTBOX_BATCH_SIZE:-100}

      VERGE_KAFKA_BROKERS: kafka:29092
    restart: unless-stopped
    labels:
      - "mode=polling"

volumes:
  kafka_data:
