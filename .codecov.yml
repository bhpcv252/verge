codecov:
  require_ci_to_pass: true

coverage:
  precision: 0
  round: nearest
  range: "60...90"

  status:
    project:
      default:
        target: auto
        threshold: 2%

    patch:
      default:
        target: 80%
        threshold: 5%

ignore:
  # generated protobuf/grpc code
  - "api/proto/**/*.pb.go"
  - "api/proto/**/*_grpc.pb.go"

  # app entrypoints
  - "cmd/**"

  # database migrations
  - "migrations/**"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
