services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: verge
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: verge
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=10"
      - "-c"
      - "max_wal_senders=10"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verge"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/changeme
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test:
        ["CMD-SHELL", "cypher-shell -u neo4j -p changeme 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "8080:8080" # HTTP
      - "9090:9090" # gRPC
    env_file:
      - .env
    environment:
      # override .env with docker-compose network values
      VERGE_STORAGE_POSTGRES_URL: postgres://verge:changeme@postgres:5432/verge?sslmode=disable
      VERGE_STORAGE_REDIS_URL: redis://redis:6379
      VERGE_STORAGE_NEO4J_URL: bolt://neo4j:changeme@neo4j:7687
    restart: unless-stopped

  tools:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.tools
    volumes:
      - .:/workspace
    working_dir: /workspace
    profiles:
      - tools

volumes:
  pg_data:
  redis_data:
  neo4j_data:
