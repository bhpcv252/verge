services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: verge
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: verge
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: neo4j/changeme
    ports:
      - "7687:7687"
      - "7474:7474"

  server:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile
    depends_on:
      - postgres
      - redis
      - neo4j
    ports:
      - "8080:8080"
      - "9090:9090"
      - "8081:8081"
    environment:
      VERGE_POSTGRES_HOST: postgres
      VERGE_REDIS_ADDR: redis:6379
      VERGE_NEO4J_URI: bolt://neo4j:7687

  worker:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.worker
    depends_on:
      - postgres
    environment:
      VERGE_POSTGRES_HOST: postgres

  tools:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.tools
    volumes:
      - .:/workspace
    working_dir: /workspace

volumes:
  pg_data:
